<section class="w-full h-full bg-[#f8fafc] flex justify-center items-start p-4 overflow-y-auto">
  <div class="w-full max-w-[95%] h-full bg-white border border-[#e2e8f0] rounded-lg shadow-sm p-2 md:p-4 flex flex-col">
  <ng-container *ngIf="vm$ | async as vm">
    <ng-container *ngIf="vm.resourcesTreeResidencial && vm.resourcesTreeInternalOrders">
      <div class="w-full flex justify-end items-center px-0 mb-1">
        <button class="bg-slate-50 text-black hover:font-bold px-4 py-2 rounded border border-slate-600" (click)="store.handleExportData()">Exportar</button>
      </div>
    </ng-container>
    <main class="flex justify-around items-center w-full h-full max-h-[90%] flex-1">
      <ng-container *ngIf="vm.resourcesTreeResidencial">
        <div class="flex flex-col justify-between items-center w-1/2 h-full">
          <div class="w-full h-full flex flex-col justify-between items-center gap-1 md:gap-2">
            <div class="w-full max-w-[80%] max-h-[70%] flex flex-col">
              <div class="relative mb-2">
                <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" />
                  </svg>
                </span>
                <input type="search" [(ngModel)]="valueResidential" placeholder="Búsqueda"
                  class="w-full rounded-md border border-[#e2e8f0] bg-white pl-9 pr-3 py-2 text-sm text-[#1e293b] placeholder:text-[#64748b] focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-colors" />
              </div>
              <div class="flex min-h-0 flex-1 flex-col overflow-y-auto rounded-lg border border-[#e2e8f0] bg-white shadow-sm">
                <div class="border-b border-[#e2e8f0] bg-slate-50 px-4 py-2 text-sm font-semibold text-[#1e293b]">
                  Árbol de recursos:
                </div>
                <div class="p-1">
                  <div *ngIf="vm.resourcesTreeResidencial" class="m-0 p-0">
                    <app-resource-tree [resourceNode]="vm.resourcesTreeResidencial" [searchTerm]="valueResidential" [fromResource]="'selectedResidential'"></app-resource-tree>
                  </div>
                </div>
              </div>
            </div>
            <div class="w-full flex justify-center items-center">
              <button (click)="store.confirmInternalOrdersCreation(true)" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-800 disabled:bg-gray-400 disabled:cursor-not-allowed" [disabled]="vm.selectedResidential.length === 0">Denegar</button>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-container *ngIf="vm.resourcesTreeInternalOrders">
        <div class="flex flex-col justify-start items-center w-1/2 h-full">
          <div class="w-full h-full flex flex-col justify-between items-center gap-1 md:gap-2">
            <div class="w-full max-w-[80%] max-h-[70%] flex flex-col">
              <div class="relative mb-2">
                <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" />
                  </svg>
                </span>
                <input type="search" [(ngModel)]="valueInternal" placeholder="Búsqueda"
                  class="w-full rounded-md border border-[#e2e8f0] bg-white pl-9 pr-3 py-2 text-sm text-[#1e293b] placeholder:text-[#64748b] focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-colors" />
              </div>
              <div class="flex min-h-0 flex-1 flex-col overflow-y-auto rounded-lg border border-[#e2e8f0] bg-white shadow-sm">
                <div class="border-b border-[#e2e8f0] bg-slate-50 px-4 py-2 text-sm font-semibold text-[#1e293b]">
                  Recursos con permiso denegado:
                </div>
                <div class="p-1">
                  <app-resource-tree [resourceNode]="vm.resourcesTreeInternalOrders" [searchTerm]="valueInternal" [fromResource]="'selectedInternalOrders'" [noResultsMessage]="''"></app-resource-tree>
                </div>
              </div>
            </div>
            <div class="w-full flex justify-center items-center">
              <button (click)="store.confirmInternalOrdersCreation(false)" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-800 disabled:bg-gray-400 disabled:cursor-not-allowed" [disabled]="vm.selectedInternalOrders.length===0">Permitir</button>
            </div>
          </div>
        </div>
      </ng-container>
    </main>
  </ng-container>
  </div>
</section>
