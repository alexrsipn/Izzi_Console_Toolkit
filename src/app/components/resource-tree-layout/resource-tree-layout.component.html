<div class="w-full h-full bg-[#f8fafc] flex justify-center items-start pt-4 p-4 overflow-y-auto">
  <div class="w-full max-w-4xl bg-white border border-[#e2e8f0] rounded-lg shadow-sm p-6">
    <div class="flex flex-col items-start">
      <h2 class="text-lg font-bold text-[#1e293b] m-0">Descarga árbol de recursos</h2>
      <p class="text-sm text-[#64748b] mt-1 mb-3">Configura los filtros y selecciona la línea de negocio para descargar.</p>

      <mat-form-field appearance="outline" class="w-full max-w-md custom-outline-field">
        <mat-label class="text-slate-600 font-medium">Línea de negocio</mat-label>
        <mat-select [(ngModel)]="selectedBusinessLine" placeholder="Seleccionar...">
          <mat-option value="Residencial">Residencial</mat-option>
          <mat-option value="CODI">CODI</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="flex flex-wrap items-center gap-x-6 gap-y-2 mb-4 mt-1">
        <mat-checkbox color="primary" [(ngModel)]="includeWorkZones">Incluir Zonas de trabajo</mat-checkbox>
        <mat-checkbox color="primary" [(ngModel)]="includeWorkSkills">Incluir Habilidades</mat-checkbox>
        <mat-checkbox color="primary" [(ngModel)]="includeWorkSchedules">Incluir Calendario</mat-checkbox>
        <mat-checkbox color="primary" [(ngModel)]="includeInventories">Incluir Inventarios</mat-checkbox>
      </div>

      <button [disabled]="!selectedBusinessLine" (click)="downloadResourceTree()"
        class="bg-indigo-600 text-white hover:bg-indigo-800 disabled:bg-gray-400 disabled:cursor-not-allowed font-semibold px-5 py-2.5 rounded text-sm transition-colors duration-150 shadow-none">
        Descargar
      </button>
    </div>
  </div>
</div>
